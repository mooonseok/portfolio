name: Verify

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.indexing }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - indexing: default
            site-url: ''
            site-indexable: ''
          - indexing: public
            # Reserved test origin; this workflow never deploys the build.
            site-url: https://portfolio.example.test
            site-indexable: 'true'
    env:
      SITE_URL: ${{ matrix.site-url }}
      SITE_INDEXABLE: ${{ matrix.site-indexable }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Check boundaries
        run: pnpm check:boundaries
      - name: Check formatting
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Check anchors
        run: pnpm check:anchors
      - name: Check metadata
        run: pnpm check:metadata
